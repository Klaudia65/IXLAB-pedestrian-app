<!-- @dsCard group="Colors" viewport="700x180" name="Brand Core Palette" subtitle="The seven Structured Fluidity hues" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg-canvas); font-family: var(--font-mono); }
  .wrap { display: flex; gap: 0; padding: 24px; }
  .sw { flex: 1; }
  .chip { height: 84px; border-radius: var(--radius-md); border: 1px solid var(--border-hairline); }
  .meta { padding: 10px 2px 0; }
  .name { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-strong); font-weight: 700; }
  .hex { font-size: 11px; color: var(--text-muted); letter-spacing: 0.06em; margin-top: 2px; }
  .wrap { gap: 12px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="sw"><div class="chip" style="background:var(--ivory)"></div><div class="meta"><div class="name">Canvas</div><div class="hex">#C1EBE9</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--cobalt)"></div><div class="meta"><div class="name">Cobalt</div><div class="hex">#4456FF</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--mint)"></div><div class="meta"><div class="name">Mint</div><div class="hex">#A6FFE8</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--lime)"></div><div class="meta"><div class="name">Lime</div><div class="hex">#C9FF46</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--liliac)"></div><div class="meta"><div class="name">Liliac</div><div class="hex">#9FA3FF</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--orchid)"></div><div class="meta"><div class="name">Orchid</div><div class="hex">#D238EB</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--seaweed)"></div><div class="meta"><div class="name">Seaweed</div><div class="hex">#255A4B</div></div></div>
  </div>
</body>
</html>
