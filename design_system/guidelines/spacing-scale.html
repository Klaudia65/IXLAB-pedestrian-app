<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing Scale" subtitle="4px base rhythm" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg-canvas); padding: 28px; display: flex; gap: 18px; align-items: flex-end; font-family: var(--font-mono); }
  .col { text-align: center; }
  .bar { background: var(--cobalt); border-radius: 6px; width: 100%; }
  .col { width: 44px; }
  .n { font-size: 10px; color: var(--text-muted); margin-top: 8px; letter-spacing: 0.06em; }
</style>
</head>
<body>
  <div class="col"><div class="bar" style="height:4px"></div><div class="n">1·4</div></div>
  <div class="col"><div class="bar" style="height:8px"></div><div class="n">2·8</div></div>
  <div class="col"><div class="bar" style="height:12px"></div><div class="n">3·12</div></div>
  <div class="col"><div class="bar" style="height:16px"></div><div class="n">4·16</div></div>
  <div class="col"><div class="bar" style="height:24px"></div><div class="n">6·24</div></div>
  <div class="col"><div class="bar" style="height:32px"></div><div class="n">8·32</div></div>
  <div class="col"><div class="bar" style="height:48px"></div><div class="n">12·48</div></div>
  <div class="col"><div class="bar" style="height:64px"></div><div class="n">16·64</div></div>
</body>
</html>
