<!-- @dsCard group="Spacing" viewport="700x160" name="Radii · Pill-First" subtitle="Controls are fully rounded; surfaces softly so" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg-canvas); padding: 28px; display: flex; gap: 20px; align-items: center; font-family: var(--font-mono); }
  .col { text-align: center; }
  .box { width: 96px; height: 64px; background: var(--cobalt-100); border: 2px solid var(--cobalt); }
  .n { font-size: 10px; color: var(--text-muted); margin-top: 10px; letter-spacing: 0.1em; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="col"><div class="box" style="border-radius:999px"></div><div class="n">pill · 999</div></div>
  <div class="col"><div class="box" style="border-radius:28px"></div><div class="n">lg · 28</div></div>
  <div class="col"><div class="box" style="border-radius:18px"></div><div class="n">md · 18</div></div>
  <div class="col"><div class="box" style="border-radius:12px"></div><div class="n">sm · 12</div></div>
</body>
</html>
