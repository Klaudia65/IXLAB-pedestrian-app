<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces & Text" subtitle="Ivory surfaces, Seaweed text ramp" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg-canvas); font-family: var(--font-mono); }
  .wrap { display: flex; gap: 14px; padding: 24px; align-items: stretch; }
  .col { flex: 1; }
  .box { height: 60px; border-radius: var(--radius-md); border: 1px solid var(--border-hairline); display: flex; align-items: center; justify-content: center; font-size: 11px; letter-spacing: 0.08em; }
  .lbl { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); margin-top: 8px; }
  .txt { font-family: var(--font-display); font-weight: 700; font-size: 22px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="col"><div class="box" style="background:var(--ivory-pure)">CANVAS</div><div class="lbl">ivory-pure</div></div>
    <div class="col"><div class="box" style="background:var(--ivory-soft)">RAISED</div><div class="lbl">ivory-soft</div></div>
    <div class="col"><div class="box" style="background:var(--surface-overlay);backdrop-filter:blur(8px)">GLASS</div><div class="lbl">overlay 72%</div></div>
    <div class="col"><div class="box" style="background:var(--ivory-soft);gap:14px"><span class="txt" style="color:var(--text-strong)">Aa</span><span class="txt" style="color:var(--text-body)">Aa</span><span class="txt" style="color:var(--text-muted)">Aa</span></div><div class="lbl">strong · body · muted</div></div>
  </div>
</body>
</html>
