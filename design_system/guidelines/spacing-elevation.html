<!-- @dsCard group="Spacing" viewport="700x200" name="Glow & Shadow" subtitle="Path glows, soft elevation on ivory" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg-canvas); padding: 34px; display: flex; gap: 26px; align-items: center; flex-wrap: wrap; font-family: var(--font-mono); }
  .col { text-align: center; }
  .dot { width: 64px; height: 64px; border-radius: 999px; margin: 0 auto; }
  .pill { width: 110px; height: 48px; border-radius: 999px; background: var(--surface-card); }
  .n { font-size: 10px; color: var(--text-muted); margin-top: 14px; letter-spacing: 0.1em; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="col"><div class="dot" style="background:var(--mint);box-shadow:var(--glow-mint)"></div><div class="n">glow-mint</div></div>
  <div class="col"><div class="dot" style="background:var(--lime);box-shadow:var(--glow-lime)"></div><div class="n">glow-lime</div></div>
  <div class="col"><div class="dot" style="background:var(--orchid);box-shadow:var(--glow-orchid)"></div><div class="n">glow-orchid</div></div>
  <div class="col"><div class="pill" style="box-shadow:var(--shadow-card)"></div><div class="n">shadow-card</div></div>
  <div class="col"><div class="pill" style="box-shadow:var(--shadow-raised)"></div><div class="n">shadow-raised</div></div>
</body>
</html>
