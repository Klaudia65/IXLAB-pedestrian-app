<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg-canvas); display: flex; align-items: center; justify-content: center; height: 200px; }
  .mark { font-family: var(--font-display); font-weight: 700; font-size: 56px; letter-spacing: -0.03em; color: var(--seaweed-900); display: inline-flex; align-items: baseline; }
  .dot { width: 16px; height: 16px; border-radius: 999px; background: var(--cobalt); box-shadow: var(--glow-cobalt); margin-left: 4px; align-self: flex-end; margin-bottom: 10px; }
</style>
</head>
<body>
  <span class="mark">wander<span class="dot"></span></span>
</body>
</html>
