<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg-canvas); padding: 28px; }
  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; padding: 9px 0; }
  .meta { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); white-space: nowrap; }
  .p { font-family: var(--font-ui); color: var(--text-body); }
</style>
</head>
<body>
  <div class="row"><span class="p" style="font-size:18px">A calm pedestrian route, tuned to your pace.</span><span class="meta">body-lg / 18</span></div>
  <div class="row"><span class="p" style="font-size:16px">We weight quiet streets, green cover, and good light.</span><span class="meta">base / 16</span></div>
  <div class="row"><span class="p" style="font-size:14px">Avoiding two busy crossings adds three minutes.</span><span class="meta">sm / 14</span></div>
</body>
</html>
