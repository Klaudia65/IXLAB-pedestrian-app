<!-- @dsCard group="Brand" viewport="780x440" name="Iconography" subtitle="Thin-stroke 1.75px round set (Lucide-compatible)" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body {
    margin: 0;
    background: var(--bg-canvas);
    padding: 30px 34px;
    color: var(--seaweed-700);
    font-family: var(--font-ui);
  }
  .group { margin-bottom: 26px; }
  .group:last-child { margin-bottom: 0; }
  .group-label {
    font-family: var(--font-mono);
    font-size: var(--mono-label);
    letter-spacing: var(--track-label);
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 0 0 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border-hairline);
  }
  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 22px;
  }
  .ico {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: 74px;
  }
  .ico svg { display: block; }
  .ico span {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-muted);
    text-align: center;
    line-height: 1.25;
  }
  .solo   { color: var(--outing-solo); }
  .couple { color: var(--outing-couple); }
  .group3 { color: var(--outing-friends); }
</style>
</head>
<body>

  <!-- ============ UTILITY ============ -->
  <div class="group">
    <p class="group-label">Utility</p>
    <div class="row">
      <div class="ico">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <span>search</span>
      </div>
      <div class="ico">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg>
        <span>navigate</span>
      </div>
      <div class="ico">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 10 3.8 10 5.5c0 3.11-2 5.66-2 8.68V16a2 2 0 1 1-4 0Z"/><path d="M20 20v-2.38c0-2.12 1.03-3.12 1-5.62-.03-2.72-1.49-6-4.5-6C14.63 6 14 7.8 14 9.5c0 3.11 2 5.66 2 8.68V20a2 2 0 1 0 4 0Z"/><path d="M16 17h4M4 13h4"/></svg>
        <span>walk</span>
      </div>
      <div class="ico">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.5 7-11a7 7 0 0 0-14 0c0 5.5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
        <span>pin</span>
      </div>
      <div class="ico">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.6-7-9.4A3.6 3.6 0 0 1 12 8a3.6 3.6 0 0 1 7-1.4C19 11.4 12 20 12 20z"/></svg>
        <span>save</span>
      </div>
      <div class="ico">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
        <span>time</span>
      </div>
      <div class="ico">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c8 1 14-5 14-14-9 0-15 6-14 14zM5 19c2-5 5-8 10-10"/></svg>
        <span>route</span>
      </div>
      <div class="ico">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg>
        <span>weather</span>
      </div>
    </div>
  </div>

  <!-- ============ PLACE CATEGORIES ============ -->
  <div class="group">
    <p class="group-label">Place categories</p>
    <div class="row">
      <div class="ico">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21c5.5 0 3.8-5 0.6-7s-1.8-6 4.4-7.6"/><path d="M15.5 3.4l1.5 2.3h-1l1.2 1.9h-3.4l1.2-1.9h-1z"/><path d="M18.5 6.6l1.4 2.1h-0.9l1.1 1.7h-3.2l1.1-1.7h-0.9z"/></svg>
        <span>nature &amp; outdoor</span>
      </div>
      <div class="ico">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14l1 4q-1.6 1.5 -3.2 0 -1.6 1.5 -3.2 0 -1.6 1.5 -3.2 0 -1.6 1.5 -3.2 0 -1.6 1.5 -3.2 0z"/><path d="M5.5 8.5V20M18.5 8.5V20M5 20h14"/></svg>
        <span>culture &amp; knowledge</span>
      </div>
      <div class="ico">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v6a2 2 0 0 0 4 0V3M8 9v12"/><path d="M15.5 3c1.5 1.2 2 3.8 2 6 0 1.6-1 2.6-2 2.8V21"/></svg>
        <span>food &amp; drink</span>
      </div>
      <div class="ico">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h12a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-6l-4 3.5V15H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/><path d="M8 9.5h6M8 12.5h4"/></svg>
        <span>social &amp; leisure</span>
      </div>
      <div class="ico">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="15" cy="9" r="1.6"/><path d="M4 17l4-4 3 3 4-5 5 5"/></svg>
        <span>urban texture</span>
      </div>
    </div>
  </div>

  <!-- ============ OUTING PERSONALITY ============ -->
  <div class="group">
    <p class="group-label">Outing personality</p>
    <div class="row">
      <div class="ico solo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"/><path d="M5.5 20a6.5 6.5 0 0 1 13 0"/></svg>
        <span>solo friendly</span>
      </div>
      <div class="ico couple">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="8.5" cy="8" r="2.8"/><circle cx="15.5" cy="8" r="2.8"/><path d="M3.5 20a5 5 0 0 1 9 0M11.5 20a5 5 0 0 1 9 0"/></svg>
        <span>couple friendly</span>
      </div>
      <div class="ico group3">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="2.5"/><circle cx="5.5" cy="9.5" r="2.1"/><circle cx="18.5" cy="9.5" r="2.1"/><path d="M7.5 20a4.5 4.5 0 0 1 9 0M2 20a3.6 3.6 0 0 1 5.2-3.2M22 20a3.6 3.6 0 0 0-5.2-3.2"/></svg>
        <span>group friendly</span>
      </div>
    </div>
  </div>

</body>
</html>
