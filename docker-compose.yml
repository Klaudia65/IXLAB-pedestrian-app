# Full local stack: PostGIS database + FastAPI backend, on one private network.
# This is also the shape you'll later deploy to the cloud.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: lab_user
      POSTGRES_PASSWORD: ixlab6531
      POSTGRES_DB: explore
    ports:
      - "5433:5432"                      # reachable from host tools (collector) at localhost:5433
                                          # (5432 is left free: a native Postgres install on this
                                          # machine also claims it, which caused host tools to connect
                                          # to the wrong server)
    volumes:
      - pgdata:/var/lib/postgresql/data  # data survives container restarts
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro   # reference data tables, runs on first init
      - ./backend/sql/study.sql:/docker-entrypoint-initdb.d/02_study.sql:ro # study/telemetry tables, runs on first init
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab_user -d explore"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app          # live code: edits reload without rebuilding the image
    environment:
      # inside the compose network the DB host is the service name "db"
      DATABASE_URL: postgresql+asyncpg://lab_user:ixlab6531@db:5432/explore
      DEBUG: "true"
      VECTOR_DIM: "64"
      # shared key the app must send (X-Study-Key) to write study data.
      # dev value; change it to a real secret before deploying publicly.
      STUDY_WRITE_KEY: "dev-study-key-change-me"
      # read/export key (X-Export-Key). Locally DEBUG=true already allows exports
      # without it; set it here to exercise the production behaviour.
      STUDY_EXPORT_KEY: "dev-export-key-change-me"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy       # wait until Postgres is ready

volumes:
  pgdata:
